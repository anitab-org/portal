{% extends "base.html" %}

{% load url from future %}

{% load i18n %}
{% block head_title %}{% trans "Sign Out" %}{% endblock %}
{% block content %}
  <div class="mt40"></div>
  <div class="container">
	<form class="login form-signin" role="form" method="post" action="{% url 'account_logout' %}">
		<h2>{% trans "Sign Out" %}</h2>
		<hr/>
		<p>{% trans 'Are you sure you want to sign out?' %}</p>
		{% csrf_token %}
		{% if redirect_field_value %}
			<input type="hidden" name="{{redirect_field_name}}" value="{{redirect_field_value}}"/>
		{% endif %}
		 <div class="mt40"></div>
		<button class="primaryAction btn btn-lg btn-primary btn-block" type="submit">{% trans 'Sign Out' %}</button>
	</form>
  </div>
  <div class="mt40"></div>
{% endblock %}
