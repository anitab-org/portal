{% extends "account/base.html" %}
{% load url from future %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block head_title %}{% trans "Change Password" %}{% endblock %}
{% block content %}
	<div class="mt40"></div>
	<div class="container">
		<form method="POST" id="password-change_form" action="{% url 'account_change_password' %}" class="login form-signup">
			<h2>{% trans "Change Password" %}</h2>
			<hr>
			{% csrf_token %}
			{{ form|crispy }}
			<div class="mt40"></div>
			<button class="primaryAction btn btn-lg btn-primary btn-block" type="submit" name="action">
				{% trans "Change Password" %}
			</button>
		</form>
	</div>
	<div class="mt40"></div>
{% endblock %}
