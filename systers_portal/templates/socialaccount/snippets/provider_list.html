{% load socialaccount %}

{% for provider in socialaccount.providers %}
  <button title="{{ provider.name }}" role="button"
    class="socialaccount_provider {{ provider.id }}"
     href="{% provider_login_url provider.id process=process %}">
     <i class="fa fa-{{ provider.name | lower }}"></i>

     {{ provider.name }}</button>

{% endfor %}
