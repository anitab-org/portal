{% load socialaccount %}

{% for provider in socialaccount.providers %}
  <a title="{{ provider.name }}" role="button"
     class="btn btn-default btn-sm {{ provider.id }}"
     href="{% provider_login_url provider.id process=process %}">
    <i class="fa fa-{{ provider.name |lower }}"></i>{{ provider.name }}</a>
{% endfor %}
